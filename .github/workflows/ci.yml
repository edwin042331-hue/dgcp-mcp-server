name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verificar:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas unitarias (sin red)
        run: npm test

      - name: Compilar
        run: npm run build

      - name: El servidor arranca y registra sus herramientas
        run: |
          node --input-type=module -e '
            import { Client } from "@modelcontextprotocol/sdk/client/index.js";
            import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";
            const c = new Client({ name: "ci", version: "1" });
            await c.connect(new StdioClientTransport({ command: process.execPath, args: ["dist/index.js"] }));
            const { tools } = await c.listTools();
            console.log(`${tools.length} herramientas`);
            await c.close();
            if (tools.length !== 17) process.exit(1);
          '

  # Check requerido por la proteccion de la rama main: resume la matriz completa.
  requerido:
    name: Pruebas Vitest y Compilación TypeScript
    needs: verificar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todas las versiones de Node pasaron
        run: |
          if [ "${{ needs.verificar.result }}" != "success" ]; then
            echo "La matriz termino con: ${{ needs.verificar.result }}"
            exit 1
          fi
